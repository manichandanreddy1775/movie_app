name: Capture Movie App Screenshots

on:
  push:
    branches: [master, main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/capture-screenshots.yml'
      - '.github/scripts/capture-screenshots.cjs'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-app-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build web application
        run: flutter build web --release

      - name: Install browser tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve and capture the real app
        run: |
          python3 -m http.server 7357 --directory build/web > /tmp/movie-app-server.log 2>&1 &
          echo $! > /tmp/movie-app-server.pid
          node .github/scripts/capture-screenshots.cjs
          
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Add screenshots captured from the running Movie App"
            git push
          else
            echo "Screenshots are already up to date."
          fi

      - name: Upload all experiment screenshots to Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-app-experiment-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
